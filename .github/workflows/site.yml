# Ovoz fayllari (Sardor, Ryan mp3) va say.json — GitHub Pages'da. Ilova va server shu yerdan oladi.
# Bir martalik: repo → Settings → Pages → Source: "GitHub Actions".
name: site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Dars matnlari (ovoz uchun)
        run: npx -y esbuild@0.25.0 scripts/dump_say.ts --bundle --platform=node --outfile=/tmp/ds.js && node /tmp/ds.js > /tmp/say.json
      - name: Ovozlar keshi (yasalganlar qayta yasalmaydi)
        uses: actions/cache@v4
        with:
          path: assets/audio
          key: audio-${{ github.run_id }}
          restore-keys: audio-
      - name: Ovozlar
        run: |
          pip install -q edge-tts
          SAY_JSON=/tmp/say.json python scripts/make_audio.py || echo "ovozlar yasalmadi"
      - name: Shaxmat tahlili (server uchun) — cc.js va rasmiy Stockfish (statik, Linux)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/chess
          cp content/chess/phrases.json dist/chess/phrases.json   # server ElevenLabs ovozlarini shu ro'yxatdan yasaydi
          npx -y esbuild@0.25.0 scripts/chess_cloud.ts --bundle --platform=node --outfile=dist/chess/cc.js --alias:react-native=./scripts/stubs/react-native.ts --log-level=warning
          cd /tmp && for a in avx2 sse41-popcnt; do
            gh release download sf_17 -R official-stockfish/Stockfish -p "stockfish-ubuntu-x86-64-$a.tar" --clobber
            tar xf "stockfish-ubuntu-x86-64-$a.tar"
            f=$(find stockfish -type f -name "stockfish-ubuntu-x86-64-$a" | head -1)
            echo "uci" | timeout 10 "$f" | grep -q uciok
            cp "$f" "$GITHUB_WORKSPACE/dist/chess/sf-$a"
          done
          ls -la "$GITHUB_WORKSPACE/dist/chess"
      - name: Ovoz fayllari sayti (mp3 + say.json)
        run: |
          mkdir -p dist/audio && cp assets/audio/*.mp3 dist/audio/ 2>/dev/null || true   # ilova ovozlarni shu yerdan oladi
          cp /tmp/say.json dist/say.json   # server Ustoz ovozlarini shu ro'yxat bo'yicha yasaydi
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
