# GitHub'ga push qilinganda ilovani avtomatik yangilaydi (EAS Update).
#   main    → asosiy ilova (har kuni ishlatiladigan, widget shu yerga ochadi)
#   preview → SINOV versiyasi: alohida havola bilan ochiladi, asosiy ilovaga tegmaydi.
#             Sinab ko'rilib ma'qullangach, preview → main ga qo'shiladi.
# Bir martalik sozlash: repo → Settings → Secrets → Actions → EXPO_TOKEN.
name: publish
on:
  push:
    branches: [main, preview]
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Versiya: 1.01, 1.02 ... (run_number 3 tadan keyin boshlanadi — oldingilar sinov edi)
      - name: Versiya
        run: |
          n=$(( ${{ github.run_number }} - 3 ))
          if [ "${GITHUB_REF_NAME}" = "preview" ]; then v="sinov-$n"; else v="$(( 1 + n / 100 )).$(printf '%02d' $(( n % 100 )))"; fi
          echo "EXPO_PUBLIC_VERSION=$v" >> "$GITHUB_ENV"

      # Ovozlar: London erkak (en-GB Ryan) va o'zbekcha (uz-UZ Sardor). Xato bo'lsa — telefon ovozi.
      - name: Ovozlar
        run: |
          pip install -q edge-tts
          python scripts/make_audio.py || echo "ovozlar yasalmadi — telefon ovozi ishlatiladi"

      - run: npm ci
      - run: npx tsc --noEmit
      - name: Science testlari (fizika va javoblar)
        run: npx -y esbuild@0.25.0 scripts/test_science.ts --bundle --platform=node --outfile=/tmp/ts.js && node /tmp/ts.js
      - name: Nashr (main — asosiy, preview — sinov)
        run: |
          if [ "${GITHUB_REF_NAME}" = "preview" ]; then
            npx eas-cli@latest channel:create preview --non-interactive || true
            npx eas-cli@latest update --channel preview --message "SINOV — ${{ github.event.head_commit.message || 'manual' }}" --non-interactive
          else
            npx eas-cli@latest update --branch main --message "v${EXPO_PUBLIC_VERSION} — ${{ github.event.head_commit.message || 'manual' }}" --non-interactive
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
