# GitHub'ga push qilinganda ilovani avtomatik yangilaydi (EAS Update).
#   main → ilova (Expo Go havolasi, widget shu yerga ochadi)
# Bir martalik sozlash: repo → Settings → Secrets → Actions → EXPO_TOKEN.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Versiya: 1.01, 1.02 ... (run_number 3 tadan keyin boshlanadi — oldingilar sinov edi)
      - name: Versiya
        run: |
          n=$(( ${{ github.run_number }} - 3 ))
          v="$(( 1 + n / 100 )).$(printf '%02d' $(( n % 100 )))"
          echo "EXPO_PUBLIC_VERSION=$v" >> "$GITHUB_ENV"

      # Ovozlar: London erkak (en-GB Ryan) va o'zbekcha (uz-UZ Sardor). Xato bo'lsa — telefon ovozi.
      - run: npm ci
      - name: Dars matnlari (ovoz uchun)
        run: npx -y esbuild@0.25.0 scripts/dump_say.ts --bundle --platform=node --outfile=/tmp/ds.js && node /tmp/ds.js > /tmp/say.json
      - name: Ovozlar keshi (yasalganlar qayta yasalmaydi)
        uses: actions/cache@v4
        with:
          path: assets/audio
          key: audio-${{ github.run_id }}
          restore-keys: audio-
      - name: Ovozlar
        run: |
          pip install -q edge-tts
          SAY_JSON=/tmp/say.json python scripts/make_audio.py || echo "ovozlar yasalmadi — telefon ovozi ishlatiladi"

      - run: npx tsc --noEmit
      - run: npx eslint src scripts tests
      - name: Testlar (fizika, darslar, savollar, FR, xotira)
        run: npm test
      - name: Nashr
        run: npx eas-cli@latest update --branch main --message "v${EXPO_PUBLIC_VERSION} — ${{ github.event.head_commit.message || 'manual' }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
