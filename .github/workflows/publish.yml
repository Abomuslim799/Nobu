# GitHub'ga push qilinganda ilovani avtomatik yangilaydi (EAS Update).
# Telefonda Expo Go → Projects → nobu-dojo → main. PC terminal kerak emas.
# Bir martalik sozlash: repo → Settings → Secrets → Actions → EXPO_TOKEN.
name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Versiya: 1.01, 1.02 ... (run_number 3 tadan keyin boshlanadi — oldingilar sinov edi)
      - name: Versiya
        run: |
          n=$(( ${{ github.run_number }} - 3 ))
          echo "EXPO_PUBLIC_VERSION=$(( 1 + n / 100 )).$(printf '%02d' $(( n % 100 )))" >> "$GITHUB_ENV"

      # Ovozlar: London erkak (en-GB Ryan) va o'zbekcha (uz-UZ Sardor). Xato bo'lsa — telefon ovozi.
      - name: Ovozlar
        run: |
          pip install -q edge-tts
          python scripts/make_audio.py || echo "ovozlar yasalmadi — telefon ovozi ishlatiladi"

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eas-cli@latest update --branch main --message "v${EXPO_PUBLIC_VERSION} — ${{ github.event.head_commit.message || 'manual' }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
